<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iris Classifier</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 30rem; margin: 3rem auto; padding: 0 1rem; }
    form { display: grid; gap: 1rem; }
    label { display: grid; gap: .35rem; }
    input, button { font: inherit; padding: .5rem; }
    button { cursor: pointer; }
    #result { margin-top: 2rem; padding: 1rem; background: #eef8ee; border: 1px solid #9bc79b; }
    .error { color: #a00; }
  </style>
</head>
<body>
  <h1>Iris Classifier</h1>
  <form id="prediction-form">
    <label>Sepal length
      <input name="sepal_length" type="number" step="any" value="5.1" required>
    </label>
    <label>Sepal width
      <input name="sepal_width" type="number" step="any" value="3.5" required>
    </label>
    <label>Petal length
      <input name="petal_length" type="number" step="any" value="1.4" required>
    </label>
    <label>Petal width
      <input name="petal_width" type="number" step="any" value="0.2" required>
    </label>
    <button type="submit">Predict</button>
  </form>
  <div id="result" hidden></div>

  <script>
    const form = document.querySelector("#prediction-form");
    const result = document.querySelector("#result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.hidden = false;
      result.className = "";
      result.textContent = "Loading...";

      const values = Object.fromEntries(new FormData(form));
      const response = await fetch("http://127.0.0.1:8000/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.fromEntries(
          Object.entries(values).map(([key, value]) => [key, Number(value)])
        ))
      });

      const data = await response.json();
      if (!response.ok) {
        result.className = "error";
        result.textContent = data.detail || "The prediction request failed.";
        return;
      }

      result.innerHTML = `
        <h2>Prediction</h2>
        <p><strong>Class:</strong> ${data.class_name}</p>
        <p><strong>Prediction ID:</strong> ${data.prediction}</p>
        <p><strong>Confidence:</strong> ${(data.confidence * 100).toFixed(2)}%</p>
      `;
    });
  </script>
</body>
</html>
